<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Razor | Explore Products</title>

<meta property="og:title" content="Razor">
<meta property="og:description" content="Your number 1 solution for maximum security.">
<meta property="og:url" content="https://razorfn.xyz">
<meta property="og:type" content="website">
<meta property="og:image" content="https://razorfn.xyz/images/razor_transparent.png">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#0a0a0a;
    color:white;
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
}


/* BACKGROUND */

.bg-animation{
    position:fixed;
    inset:0;
    z-index:-2;

    background:
    radial-gradient(circle at 20% 40%,rgba(194,22,185,.15),transparent 40%),
    radial-gradient(circle at 80% 20%,rgba(58,0,64,.15),transparent 40%),
    radial-gradient(circle at 50% 80%,rgba(194,22,185,.1),transparent 40%);

    animation:bgMove 20s infinite alternate;
}


@keyframes bgMove{

    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(40deg);
    }

}



/* PARTICLES */


.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}


.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#c216b9;
    border-radius:50%;
    animation:float 15s linear infinite;
}


@keyframes float{

0%{
transform:translateY(100vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-100vh);
opacity:0;
}

}



/* HEADER */


.hero{

position:relative;
z-index:5;

text-align:center;

padding:100px 20px 60px;

}


.hero h1{

font-size:70px;
margin:0;

color:#c216b9;

text-shadow:
0 0 20px rgba(194,22,185,.5);

}


.hero p{

font-size:20px;
color:#aaa;

}


/* FILTERS */


.filters{

display:flex;
justify-content:center;
gap:15px;

margin-bottom:50px;

flex-wrap:wrap;

}


.filter{

padding:12px 25px;

border-radius:30px;

border:1px solid rgba(255,255,255,.1);

background:#151515;

color:#aaa;

cursor:pointer;

transition:.3s;

}


.filter:hover,
.filter.active{

background:#c216b9;
color:white;

box-shadow:
0 0 25px rgba(194,22,185,.4);

}




/* PRODUCTS */


.products-section{

max-width:1300px;
margin:auto;

padding:20px;

position:relative;
z-index:5;

}



.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,330px);
    justify-content:center;
    gap:30px;
}



/* CARD */


.product-item{

background:
linear-gradient(135deg,#121212,#1c1c1c);

border-radius:22px;

overflow:hidden;

text-decoration:none;

color:white;

border:2px solid rgba(194,22,185,.2);

transition:.4s;

opacity:0;

animation:appear .7s forwards;

}


@keyframes appear{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:none;

}

}


.product-item:hover{

transform:
translateY(-12px)
scale(1.03);


border-color:#c216b9;


box-shadow:

0 20px 50px rgba(194,22,185,.25);

}



.product-item img{

width:100%;

height:200px;

object-fit:cover;

}



.product-content{

padding:25px;

}


.product-content h2{

margin:0;

color:#c216b9;

font-size:24px;

}



.price{

margin-top:12px;

font-size:18px;

color:#33ff7a;

font-weight:700;

}



.description{

margin-top:15px;

color:#aaa;

line-height:1.6;

height:50px;

overflow:hidden;

}




.button{

margin-top:25px;

display:inline-block;

padding:12px 25px;

border-radius:30px;

background:
linear-gradient(45deg,#c216b9,#3a0040);

font-weight:600;

transition:.3s;

}


.product-item:hover .button{

box-shadow:
0 0 25px rgba(194,22,185,.5);

}




@media(max-width:768px){

.hero h1{
    font-size:45px;
}


.products{
    grid-template-columns:1fr;
}

}

</style>


</head>


<body>


<div class="bg-animation"></div>

<div class="particles" id="particles"></div>


<div id="navbar"></div>



<section class="hero">

<h1>
Explore Products
</h1>

<p>
Premium solutions built for performance, security, and reliability.
</p>

</section>




<section class="products-section">


<div class="filters">

<button class="filter active" onclick="filterProducts('All')">
All
</button>

</div>


<div class="products" id="products"></div>


</section>




<script>


let allProducts=[];


function createParticles(){

let box=document.getElementById("particles");


for(let i=0;i<60;i++){

let p=document.createElement("div");

p.className="particle";

p.style.left=Math.random()*100+"%";

p.style.animationDelay=Math.random()*15+"s";

p.style.animationDuration=(10+Math.random()*10)+"s";


box.appendChild(p);

}

}


createParticles();



async function loadProducts(){


const response =
await fetch("purchase/products.json");


allProducts =
await response.json();



createFilters();

displayProducts("All");


}




function createFilters(){


let categories=[

"All",

...new Set(allProducts.map(x=>x.category))

];


let container=document.querySelector(".filters");


container.innerHTML="";


categories.forEach(cat=>{


container.innerHTML+=`

<button class="filter ${cat=="All"?"active":""}"
onclick="filterProducts('${cat}',this)">

${cat}

</button>


`;


});


}




function filterProducts(category,btn){


document.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));


if(btn)
btn.classList.add("active");


displayProducts(category);


}





function displayProducts(category){


let container=document.getElementById("products");


container.innerHTML="";


let products =
category=="All"
?
allProducts
:
allProducts.filter(x=>x.category==category);



products.forEach((product,index)=>{


container.innerHTML+=`

<a class="product-item"
style="animation-delay:${index*.1}s"
href="purchase/product.html?id=${product.id}">


<img src="${product.images[0]}">



<div class="product-content">


<h2>
${product.title}
</h2>


<div class="price">

Starting at $${product.startingPrice}

</div>



<div class="description">

${product.description}

</div>



<div class="button">

View Product

</div>


</div>


</a>


`;


});


}



loadProducts();


</script>


<script src="navbar.js"></script>


</body>
</html>
