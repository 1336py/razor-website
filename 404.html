<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found | Razor</title>
  <meta name="theme-color" content="#07060c">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/razor_transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/razor.css">
  <script src="/assets/js/razor.js" defer></script>
  <style>
    .lost { display: grid; place-items: center; text-align: center; min-height: 60vh; padding: 48px 0; }
    .lost b {
      display: block;
      font: 800 clamp(96px, 24vw, 200px)/.9 var(--font-display);
      letter-spacing: -.04em;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .lost h1 { margin-top: 18px; font: 700 clamp(22px, 3vw, 28px)/1.2 var(--font-display); }
    .lost p { color: var(--muted); margin: 10px auto 26px; max-width: 40ch; }
    .lost div { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div data-site-nav></div>
  <main id="main" class="wrap">
    <section class="lost">
      <div>
        <b aria-hidden="true">404</b>
        <h1>This page doesn't exist</h1>
        <p>The link may be old or mistyped. Head back home or browse the shop.</p>
        <div>
          <a class="btn btn--primary" href="/explore.html">Browse the shop</a>
          <a class="btn btn--ghost" href="/">Go home</a>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
