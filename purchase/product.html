<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Product | Razor</title>
  <meta name="description" content="Razor product details, plans and pricing.">
  <meta name="theme-color" content="#07060c">
  <link rel="icon" href="/images/razor_transparent.png">
  <meta property="og:title" content="Razor">
  <meta property="og:description" content="Your number one solution for maximum security.">
  <meta property="og:url" content="https://razorfn.xyz">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://razorfn.xyz/images/razor_transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/razor.css">
  <script src="/assets/js/razor.js" defer></script>
  <style>
    .crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: clamp(24px, 4vw, 40px) 0 22px; padding: 0; list-style: none; color: var(--faint); font-size: 14px; font-weight: 600; }
    .crumbs a { color: var(--muted); text-decoration: none; }
    .crumbs a:hover { color: var(--text); }
    .crumbs li + li::before { content: "/"; margin-right: 8px; color: var(--faint); }

    .pdp { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); gap: clamp(20px, 3vw, 36px); align-items: start; }
    @media (max-width: 920px) { .pdp { grid-template-columns: 1fr; } }

    .gallery__stage {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      background: var(--ink-2);
      touch-action: pan-y;
    }
    .gallery__stage img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .45s var(--ease);
      cursor: zoom-in;
    }
    .gallery__stage img.is-active { opacity: 1; }
    .g-btn {
      position: absolute; top: 50%; z-index: 2;
      display: grid; place-items: center;
      width: 44px; height: 44px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(7, 6, 12, .7);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      color: var(--text);
      transform: translateY(-50%);
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .g-btn:hover { border-color: var(--line-strong); background: rgba(30, 20, 45, .85); }
    .g-btn svg { width: 20px; height: 20px; }
    .g-prev { left: 12px; } .g-next { right: 12px; }
    .g-zoom { top: auto; bottom: 12px; right: 12px; transform: none; width: 40px; height: 40px; }
    .thumbs { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
    .thumbs button {
      flex: none; width: 104px; aspect-ratio: 16 / 10;
      padding: 0; overflow: hidden;
      border: 2px solid transparent; border-radius: 12px;
      background: var(--ink-2); cursor: pointer; opacity: .6;
      transition: opacity .2s, border-color .2s;
    }
    .thumbs button img { width: 100%; height: 100%; object-fit: cover; }
    .thumbs button:hover { opacity: .9; }
    .thumbs button[aria-current="true"] { opacity: 1; border-color: var(--magenta); }

    .buy { padding: clamp(20px, 3vw, 30px); position: sticky; top: calc(var(--nav-h) + 28px); }
    @media (max-width: 920px) { .buy { position: static; } }
    .buy__meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .stars { display: inline-flex; gap: 2px; color: #ff8fd2; }
    .stars svg { width: 15px; height: 15px; }
    .buy h1 { margin-top: 14px; font: 700 clamp(24px, 3vw, 32px)/1.15 var(--font-display); letter-spacing: -.015em; }
    .buy__sub { margin-top: 6px; color: var(--pink); font-weight: 700; font-size: 15px; }
    .buy__desc { margin-top: 12px; color: var(--muted); }

    .plans { display: grid; gap: 8px; margin: 22px 0 0; padding: 0; border: 0; }
    .plans legend { padding: 0; margin-bottom: 10px; }
    .plan { position: relative; display: block; cursor: pointer; }
    .plan input { position: absolute; opacity: 0; pointer-events: none; }
    .plan span {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      min-height: 54px; padding: 12px 16px 12px 46px;
      border: 1px solid var(--line); border-radius: 13px;
      background: rgba(7, 6, 12, .5);
      font-weight: 700;
      transition: border-color .2s, background .2s;
    }
    .plan span::before {
      content: ""; position: absolute; left: 16px; top: 50%;
      width: 18px; height: 18px; margin-top: -9px;
      border: 2px solid var(--faint); border-radius: 50%;
      transition: border .2s;
    }
    .plan b { font-weight: 800; white-space: nowrap; }
    .plan em { font-style: normal; color: var(--muted); font-weight: 600; font-size: 14.5px; }
    .plan:hover span { border-color: var(--line-strong); }
    .plan input:checked + span { border-color: var(--magenta); background: rgba(224, 76, 216, .08); }
    .plan input:checked + span::before { border: 5px solid var(--pink); }
    .plan input:focus-visible + span { outline: 2px solid var(--pink); outline-offset: 2px; }

    .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .total span { color: var(--muted); font-weight: 600; }
    .total strong { font: 700 30px/1 var(--font-display); }

    .coupon { margin-top: 16px; }
    .coupon summary { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14.5px; font-weight: 700; cursor: pointer; list-style: none; }
    .coupon summary::-webkit-details-marker { display: none; }
    .coupon summary svg { width: 16px; height: 16px; }
    .coupon summary:hover { color: var(--text); }
    .coupon__row { display: flex; gap: 8px; margin-top: 12px; }
    .coupon__row .input { min-height: 44px; text-transform: uppercase; }
    .coupon__msg { min-height: 22px; margin-top: 8px; font-size: 14px; font-weight: 600; }
    .coupon__msg.ok { color: var(--ok); } .coupon__msg.err { color: var(--bad); }

    .buy .btn--primary { margin-top: 18px; }
    .assure { display: grid; gap: 10px; margin: 22px 0 0; padding: 18px 0 0; list-style: none; border-top: 1px solid var(--line); }
    .assure li { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14.5px; }
    .assure svg { width: 18px; height: 18px; color: var(--pink); flex: none; }

    .buybar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      display: none; align-items: center; justify-content: space-between; gap: 14px;
      padding: 12px var(--gutter) max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(12, 10, 19, .94);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      transform: translateY(110%);
      transition: transform .3s var(--ease);
    }
    .buybar div { min-width: 0; }
    .buybar small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .buybar strong { font: 700 20px/1.2 var(--font-display); }
    .buybar.is-shown { transform: none; }
    @media (max-width: 920px) { .buybar { display: flex; } }

    .related { margin-top: clamp(56px, 8vw, 88px); }
    .related h2 { font: 700 clamp(22px, 3vw, 28px)/1.2 var(--font-display); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div data-site-nav></div>

  <main id="main" class="wrap">
    <nav aria-label="Breadcrumb">
      <ol class="crumbs">
        <li><a href="/">Home</a></li>
        <li><a href="/explore.html">Shop</a></li>
        <li aria-current="page" id="crumb">Product</li>
      </ol>
    </nav>

    <div id="product-root">
      <div class="pdp">
        <div class="skeleton" style="aspect-ratio:16/10"></div>
        <div class="skeleton" style="height:520px"></div>
      </div>
    </div>

    <section class="related" id="related" hidden aria-labelledby="related-h">
      <h2 id="related-h">People also bought</h2>
      <div class="product-grid" id="related-grid"></div>
    </section>
  </main>

  <div class="buybar" id="buybar" aria-hidden="true">
    <div><small id="bb-plan"></small><strong id="bb-price"></strong></div>
    <button class="btn btn--primary" type="button" id="bb-buy" tabindex="-1">Buy now</button>
  </div>

  <div data-site-footer></div>

  <script type="module">
    const R = window.Razor;
    const root = document.getElementById("product-root");
    const id = new URLSearchParams(location.search).get("id");

    const state = { variant: 0, coupon: "" };
    let product;

    function notFound(msg) {
      document.title = "Product not found | Razor";
      document.getElementById("crumb").textContent = "Not found";
      root.innerHTML = '<div class="panel empty-state"><h2>' + R.esc(msg || "We couldn't find that product") +
        '</h2><p>The link may be old or mistyped. Every current product is in the shop.</p><a class="btn btn--primary" href="/explore.html">Browse the shop</a></div>';
      document.getElementById("buybar").remove();
    }

    function priceOf(i) {
      const v = product.variants && product.variants[i];
      return v ? Number(v.price) : Number(product.startingPrice) || 0;
    }

    function render() {
      const p = product;
      const imgs = (p.images || []).map(R.asset);
      const variants = p.variants && p.variants.length ? p.variants : [{ name: "Standard", price: p.startingPrice }];
      const stars = Array.from({ length: Math.max(0, Math.min(5, Math.round(p.rating || 5))) }, () => R.icon("star")).join("");

      document.title = p.title + " | Razor";
      document.getElementById("crumb").textContent = p.title;
      const desc = document.querySelector('meta[name="description"]');
      desc.content = p.title + ". " + p.description;

      root.innerHTML =
        '<div class="pdp">' +
          '<section class="gallery" aria-label="Screenshots">' +
            '<div class="gallery__stage" id="stage">' +
              imgs.map((src, i) => '<img src="' + R.esc(src) + '" alt="' + R.esc(p.title) + " screenshot " + (i + 1) + '" class="' + (i === 0 ? "is-active" : "") + '"' + (i === 0 ? ' fetchpriority="high"' : ' loading="lazy"') + ' decoding="async" width="1600" height="900">').join("") +
              (imgs.length > 1
                ? '<button class="g-btn g-prev" type="button" aria-label="Previous screenshot">' + R.icon("left") + '</button><button class="g-btn g-next" type="button" aria-label="Next screenshot">' + R.icon("right") + "</button>"
                : "") +
              '<button class="g-btn g-zoom" type="button" aria-label="View full size">' + R.icon("expand") + "</button>" +
            "</div>" +
            (imgs.length > 1
              ? '<div class="thumbs" role="group" aria-label="Choose screenshot">' + imgs.map((src, i) => '<button type="button" data-i="' + i + '" aria-label="Screenshot ' + (i + 1) + '" aria-current="' + (i === 0) + '"><img src="' + R.esc(R.thumb(src)) + '" alt="" loading="lazy" width="160" height="100"></button>').join("") + "</div>"
              : "") +
          "</section>" +

          '<aside class="panel buy" aria-labelledby="p-title">' +
            '<div class="buy__meta"><span class="chip">' + R.esc(p.category || "Product") + '</span><span class="stars" role="img" aria-label="Rated ' + (p.rating || 5) + ' out of 5">' + stars + "</span></div>" +
            '<h1 id="p-title">' + R.esc(p.title) + "</h1>" +
            (p.subtitle ? '<p class="buy__sub">' + R.esc(p.subtitle) + "</p>" : "") +
            '<p class="buy__desc">' + R.esc(p.description) + "</p>" +

            '<fieldset class="plans"><legend class="field-label">Choose a plan</legend>' +
              variants.map((v, i) => '<label class="plan"><input type="radio" name="plan" value="' + i + '"' + (i === state.variant ? " checked" : "") + '><span><em>' + R.esc(v.name) + "</em><b>" + (Number(v.price) === 0 ? "Free" : R.money(v.price)) + "</b></span></label>").join("") +
            "</fieldset>" +

            '<details class="coupon"' + (state.coupon ? " open" : "") + '><summary>' + R.icon("tag") + 'Have a discount code?</summary>' +
              '<form class="coupon__row" id="coupon-form" novalidate><label class="sr-only" for="coupon">Discount code</label><input class="input" id="coupon" autocomplete="off" spellcheck="false" placeholder="Enter code" maxlength="32"><button class="btn" type="submit">Apply</button></form>' +
              '<div class="coupon__msg" id="coupon-msg" role="status"></div>' +
            "</details>" +

            '<div class="total"><span>Total</span><strong id="total"></strong></div>' +
            '<button class="btn btn--primary btn--lg btn--block" type="button" id="buy">' + R.icon("bolt") + "Buy now</button>" +

            '<ul class="assure">' +
              "<li>" + R.icon("shield") + "Paid in Litecoin, verified by staff</li>" +
              "<li>" + R.icon("chat") + "Delivered with setup help in a Discord ticket</li>" +
              "<li>" + R.icon("refresh") + "Updates included for your plan</li>" +
            "</ul>" +
          "</aside>" +
        "</div>";

      wireGallery(imgs);
      wireBuy(variants);
    }

    function wireGallery(imgs) {
      const stage = document.getElementById("stage");
      const slides = stage.querySelectorAll("img");
      const thumbs = document.querySelectorAll(".thumbs button");
      let cur = 0;
      const go = (n) => {
        if (!slides.length) return;
        slides[cur].classList.remove("is-active");
        cur = (n + slides.length) % slides.length;
        slides[cur].classList.add("is-active");
        thumbs.forEach((t, i) => t.setAttribute("aria-current", String(i === cur)));
      };
      stage.addEventListener("click", (e) => {
        if (e.target.closest(".g-prev")) return go(cur - 1);
        if (e.target.closest(".g-next")) return go(cur + 1);
        if (e.target.closest(".g-zoom") || e.target.tagName === "IMG") R.lightbox(imgs, cur);
      });
      thumbs.forEach((t) => t.addEventListener("click", () => go(+t.dataset.i)));
      let sx = null;
      stage.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener("touchend", (e) => {
        if (sx == null) return;
        const dx = e.changedTouches[0].clientX - sx;
        if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1));
        sx = null;
      });
      stage.tabIndex = 0;
      stage.setAttribute("aria-roledescription", "carousel");
      stage.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") go(cur - 1);
        if (e.key === "ArrowRight") go(cur + 1);
      });
    }

    function wireBuy(variants) {
      const total = document.getElementById("total");
      const bbPrice = document.getElementById("bb-price");
      const bbPlan = document.getElementById("bb-plan");
      const update = () => {
        const price = priceOf(state.variant);
        const label = price === 0 ? "Free" : R.money(price);
        total.textContent = label;
        bbPrice.textContent = label;
        bbPlan.textContent = variants[state.variant].name;
      };
      document.querySelectorAll('input[name="plan"]').forEach((r) =>
        r.addEventListener("change", () => { state.variant = +r.value; update(); }));
      update();

      const input = document.getElementById("coupon");
      const msg = document.getElementById("coupon-msg");
      if (state.coupon) { input.value = state.coupon; msg.className = "coupon__msg ok"; msg.textContent = "Code " + state.coupon + " saved to your order."; }
      document.getElementById("coupon-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const code = input.value.trim().toUpperCase();
        if (!code) { msg.className = "coupon__msg err"; msg.textContent = "Enter a code first."; state.coupon = ""; return; }
        if (R.config.coupons.includes(code)) {
          state.coupon = code;
          msg.className = "coupon__msg ok";
          msg.textContent = "Code " + code + " saved. Staff apply the discount when they verify your order.";
        } else {
          state.coupon = "";
          msg.className = "coupon__msg err";
          msg.textContent = "That code isn't valid. Check the spelling or ask in Discord.";
        }
      });

      const buy = () => {
        const q = new URLSearchParams({ id: product.id, variant: String(state.variant) });
        if (state.coupon) q.set("coupon", state.coupon);
        location.href = "/purchase/checkout.html?" + q;
      };
      document.getElementById("buy").addEventListener("click", buy);
      document.getElementById("bb-buy").addEventListener("click", buy);

      const bar = document.getElementById("buybar");
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(([en]) => {
          const show = !en.isIntersecting && en.boundingClientRect.top < 0;
          bar.classList.toggle("is-shown", show);
          bar.setAttribute("aria-hidden", String(!show));
          document.getElementById("bb-buy").tabIndex = show ? 0 : -1;
        }).observe(document.getElementById("buy"));
      }
    }

    function renderRelated(all) {
      const ids = (product.related || []).filter((r) => r !== product.id);
      const list = ids.map((r) => all.find((p) => p.id === r)).filter(Boolean);
      if (!list.length) return;
      document.getElementById("related-grid").innerHTML = list.map((p) => R.productCard(p)).join("");
      document.getElementById("related").hidden = false;
    }

    if (!id) notFound();
    else R.products().then((all) => {
      product = all.find((p) => p.id === id);
      if (!product) return notFound();
      render();
      renderRelated(all);
    }).catch(() => notFound("Products didn't load"));
  </script>
</body>
</html>
