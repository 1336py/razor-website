<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checkout | Razor</title>
  <meta name="theme-color" content="#07060c">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/razor_transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/razor.css">
  <script src="/assets/js/razor.js" defer></script>
  <script src="/assets/js/checkout.js" defer></script>
</head>
<body>
  <div data-site-nav></div>

  <main id="main" class="wrap">
    <div class="flow" id="flow">
      <div class="skeleton" style="height:460px"></div>
    </div>
  </main>

  <div data-site-footer></div>

  <script type="module">
    const R = window.Razor, C = window.RazorCheckout;
    const flow = document.getElementById("flow");

    C.createFromURL().then((order) => {
      if (!order) { flow.innerHTML = C.missing(); return; }
      const back = "/purchase/product.html?id=" + encodeURIComponent(order.productId);
      flow.innerHTML =
        C.steps(0) +
        '<section class="panel">' +
          "<h1>Review your order</h1>" +
          '<p class="flow__lead">Check the details below. Your order ID is what staff use to find your payment, so keep it handy.</p>' +
          C.summary(order) +
          '<div class="actions">' +
            '<a class="btn btn--primary btn--lg" href="/purchase/payment.html?' + C.query(order) + '">Continue to payment</a>' +
            '<a class="btn btn--ghost" href="' + back + '">Change plan</a>' +
          "</div>" +
        "</section>";
    }).catch(() => {
      flow.innerHTML = '<div class="panel empty-state"><h2>Checkout didn\'t load</h2><p>Refresh the page. If it keeps happening, open a ticket in Discord.</p><button class="btn btn--primary" type="button" onclick="location.reload()">Refresh</button></div>';
    });
  </script>
</body>
</html>
