<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order submitted | Razor</title>
  <meta name="theme-color" content="#07060c">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/razor_transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/razor.css">
  <script src="/assets/js/razor.js" defer></script>
  <script src="/assets/js/checkout.js" defer></script>
  <style>
    .done { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 18px; border-radius: 18px; background: var(--grad); box-shadow: var(--glow); }
    .done svg { width: 28px; height: 28px; color: #fff; stroke-width: 2.6; }
    .txid { margin-top: 24px; }
    .txid__hint { min-height: 20px; font-size: 13.5px; color: var(--faint); }
    .txid__hint.warn { color: var(--warn); }
  </style>
</head>
<body>
  <div data-site-nav></div>

  <main id="main" class="wrap">
    <div class="flow" id="flow">
      <div class="skeleton" style="height:560px"></div>
    </div>
  </main>

  <div data-site-footer></div>

  <script type="module">
    const R = window.Razor, C = window.RazorCheckout;
    const flow = document.getElementById("flow");

    C.current().then((order) => {
      if (!order) { flow.innerHTML = C.missing(); return; }
      const free = order.price === 0;

      flow.innerHTML =
        C.steps(2) +
        '<section class="panel">' +
          '<div class="done">' + R.icon("check") + "</div>" +
          "<h1>Order created</h1>" +
          '<p class="flow__lead">One last step: send these details in a Discord ticket so staff can verify ' + (free ? "your boosts" : "your payment") + " and deliver.</p>" +
          C.summary(order) +
          (free ? "" :
            '<div class="field txid"><label for="txid">Transaction ID (TXID)</label>' +
            '<input class="input input--mono" id="txid" placeholder="Paste your transaction ID" autocomplete="off" spellcheck="false">' +
            '<div class="txid__hint" id="txid-hint">Find it in your wallet\'s transaction history.</div></div>') +
          '<ol class="checklist">' +
            "<li><span>Copy your order details" + (free ? "" : " with the TXID") + ".</span></li>" +
            "<li><span>Join our Discord and open a <b>support ticket</b>.</span></li>" +
            "<li><span>Paste the details and wait for <b>verification</b>.</span></li>" +
          "</ol>" +
          '<div class="actions actions--split">' +
            '<button class="btn btn--primary btn--lg" type="button" id="copy">' + R.icon("copy") + "Copy order details</button>" +
            '<a class="btn btn--discord btn--lg" data-discord href="' + R.config.discord + '" target="_blank" rel="noopener">' + R.icon("discord") + "Join Discord</a>" +
          "</div>" +
        "</section>";

      const txid = document.getElementById("txid");
      const hint = document.getElementById("txid-hint");
      const key = "razorTxid:" + order.id;
      if (txid) {
        try { txid.value = sessionStorage.getItem(key) || ""; } catch (e) {}
        txid.addEventListener("input", () => {
          const v = txid.value.trim();
          try { sessionStorage.setItem(key, v); } catch (e) {}
          const looksRight = /^[a-fA-F0-9]{64}$/.test(v);
          hint.className = "txid__hint" + (v && !looksRight ? " warn" : "");
          hint.textContent = !v ? "Find it in your wallet's transaction history." : looksRight ? "Looks good." : "A Litecoin TXID is usually 64 characters of 0-9 and a-f. Double-check it.";
        });
      }

      document.getElementById("copy").addEventListener("click", () => {
        const lines = [
          "Razor Order", "",
          "Order ID:", order.id, "",
          "Product:", order.product, "",
          "Variant:", order.variant || "Default", "",
          "Amount:", free ? "Free" : R.money(order.price),
        ];
        if (order.coupon) lines.push("", "Discount code:", order.coupon);
        if (!free) lines.push("", "TXID:", txid.value.trim() || "(not provided)");
        R.copy(lines.join("\n"), "Order details");
      });
    }).catch(() => { flow.innerHTML = C.missing(); });
  </script>
</body>
</html>
