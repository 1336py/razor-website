<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order submitted | Razor</title>
  <meta name="theme-color" content="#07060c">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/razor_transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/razor.css">
  <script src="/assets/js/razor.js" defer></script>
  <script src="/assets/js/checkout.js" defer></script>
  <script src="/assets/js/ltc.js" defer></script>
  <style>
    .done { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 18px; border-radius: 18px; background: var(--grad); box-shadow: var(--glow); }
    .done svg { width: 28px; height: 28px; color: #fff; stroke-width: 2.6; }
    .txid { margin-top: 24px; }
    .txid__row { display: flex; gap: 8px; }
    .txid__row .input { min-width: 0; }
    .txid__hint { min-height: 20px; font-size: 13.5px; color: var(--faint); }
    .txid__hint.warn { color: var(--warn); }
  </style>
</head>
<body>
  <div data-site-nav></div>

  <main id="main" class="wrap">
    <div class="flow" id="flow">
      <div class="skeleton" style="height:560px"></div>
    </div>
  </main>

  <div data-site-footer></div>

  <script type="module">
    const R = window.Razor, C = window.RazorCheckout, L = window.RazorLTC;
    const flow = document.getElementById("flow");
    let order;

    function verdictHTML(res, txid) {
      const link = '<a href="' + R.esc(L.txUrl(txid)) + '" target="_blank" rel="noopener">View on explorer</a>';
      if (res.status === "error") return { kind: "warn", text: "Couldn't reach the blockchain checker right now. That's fine: staff verify every payment by hand. " + link };
      if (res.status === "notfound") return { kind: "warn", text: "No transaction with this ID was found yet. New transactions can take a minute to appear, so check the ID and try again." };
      if (!res.toWallet) return { kind: "bad", text: "This transaction doesn't send anything to the Razor wallet. Make sure you copied the TXID of your Razor payment. " + link };
      const expected = order.ltcQuote && order.ltcQuote.ltc;
      const verdict = L.judge(res.paidLtc, expected);
      const conf = res.confirmed ? res.confirmations + (res.confirmations === 1 ? " confirmation" : " confirmations") : "unconfirmed, waiting for the network";
      const amount = L.fmtLtc(res.paidLtc) + " LTC received (" + conf + ").";
      if (verdict === "short") return { kind: "bad", text: amount + " That's less than the " + L.fmtLtc(expected) + " LTC quoted. Mention this in your ticket. " + link };
      return { kind: res.confirmed ? "ok" : "warn", text: amount + (verdict === "ok" ? " Amount matches your quote." : "") + " " + link };
    }

    function renderVerdict(v) {
      const box = document.getElementById("verdict");
      if (!v) { box.hidden = true; return; }
      box.hidden = false;
      box.className = "verdict is-" + v.kind;
      box.innerHTML = R.icon(v.kind === "ok" ? "check" : v.kind === "bad" ? "alert" : "info") + "<span>" + v.text + "</span>";
    }

    async function check() {
      const input = document.getElementById("txid");
      const btn = document.getElementById("check");
      const txid = input.value.trim();
      if (!L.isTxid(txid)) { renderVerdict({ kind: "warn", text: "Paste the full 64-character transaction ID first." }); return; }
      btn.disabled = true;
      btn.textContent = "Checking…";
      let res;
      try { res = await L.checkTx(txid, R.config.ltcWallet); } catch (e) { res = { status: "error" }; }
      btn.disabled = false;
      btn.textContent = "Check payment";
      const v = verdictHTML(res, txid);
      renderVerdict(v);
      if (res.status === "found") {
        order = C.patch(order.id, { txid, payment: { toWallet: res.toWallet, paidLtc: res.paidLtc, confirmed: res.confirmed, confirmations: res.confirmations, checkedAt: Date.now(), kind: v.kind } }) || order;
      }
    }

    C.current().then((o) => {
      order = o;
      if (!order) { flow.innerHTML = C.missing(); return; }
      const free = order.price === 0;

      flow.innerHTML =
        C.steps(2) +
        '<section class="panel">' +
          '<div class="done">' + R.icon("check") + "</div>" +
          "<h1>Order created</h1>" +
          '<p class="flow__lead">One last step: send these details in a Discord ticket so staff can verify ' + (free ? "your boosts" : "your payment") + " and deliver.</p>" +
          C.summary(order) +
          (free ? "" :
            '<div class="field txid"><label for="txid">Transaction ID (TXID)</label>' +
            '<div class="txid__row"><input class="input input--mono" id="txid" placeholder="Paste your transaction ID" autocomplete="off" spellcheck="false">' +
            '<button class="btn" type="button" id="check">Check payment</button></div>' +
            '<div class="txid__hint" id="txid-hint">Find it in your wallet\'s transaction history.</div></div>' +
            '<div class="verdict" id="verdict" role="status" hidden></div>') +
          '<ol class="checklist">' +
            "<li><span>Copy your order details" + (free ? "" : " with the TXID") + ".</span></li>" +
            "<li><span>Join our Discord and open a <b>support ticket</b>.</span></li>" +
            "<li><span>Paste the details and wait for <b>verification</b>.</span></li>" +
          "</ol>" +
          '<div class="actions actions--split">' +
            '<button class="btn btn--primary btn--lg" type="button" id="copy">' + R.icon("copy") + "Copy order details</button>" +
            '<a class="btn btn--discord btn--lg" href="' + R.config.discord + '" target="_blank" rel="noopener">' + R.icon("discord") + "Join Discord</a>" +
          "</div>" +
          '<p class="flow__foot">Saved on this device under <a href="/orders.html">My orders</a>.</p>' +
        "</section>";

      const txid = document.getElementById("txid");
      if (txid) {
        const hint = document.getElementById("txid-hint");
        txid.value = order.txid || "";
        const onInput = () => {
          const v = txid.value.trim();
          const ok = L.isTxid(v);
          hint.className = "txid__hint" + (v && !ok ? " warn" : "");
          hint.textContent = !v ? "Find it in your wallet's transaction history." : ok ? "Looks right. Check it against the blockchain, or just copy your details." : "A Litecoin TXID is 64 characters of 0-9 and a-f. Double-check it.";
          if (ok && v !== order.txid) order = C.patch(order.id, { txid: v }) || order;
        };
        txid.addEventListener("input", onInput);
        txid.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
        document.getElementById("check").addEventListener("click", check);
        if (order.txid) { onInput(); check(); }
      }

      document.getElementById("copy").addEventListener("click", () => {
        const lines = [
          "Razor Order", "",
          "Order ID:", order.id, "",
          "Product:", order.product, "",
          "Variant:", order.variant || "Default", "",
          "Amount:", free ? "Free" : R.money(order.price),
        ];
        if (!free && order.ltcQuote) lines.push("", "LTC quoted:", L.fmtLtc(order.ltcQuote.ltc) + " LTC @ $" + Number(order.ltcQuote.usd).toFixed(2));
        if (order.coupon) lines.push("", "Discount code:", order.coupon);
        if (!free) {
          lines.push("", "TXID:", txid.value.trim() || "(not provided)");
          if (order.payment && order.payment.toWallet) lines.push("", "On-chain check:", L.fmtLtc(order.payment.paidLtc) + " LTC, " + (order.payment.confirmed ? order.payment.confirmations + " conf" : "unconfirmed"));
        }
        R.copy(lines.join("\n"), "Order details");
      });
    }).catch(() => { flow.innerHTML = C.missing(); });
  </script>
</body>
</html>
