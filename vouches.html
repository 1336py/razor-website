<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Razor | Vouches</title>

<meta property="og:title" content="Razor">
<meta property="og:description" content="Your number 1 solution for maximum security.">
<meta property="og:url" content="https://razorfn.xyz">
<meta property="og:type" content="website">
<meta property="og:image" content="https://razorfn.xyz/images/razor_transparent.png">


<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">


<style>

*{
    box-sizing:border-box;
}


body{
    margin:0;
    padding:0;

    font-family:'Montserrat',sans-serif;

    background:#0a0a0a;
    color:white;

    overflow-x:hidden;
}



/* BACKGROUND */

.bg-animation{

    position:fixed;
    inset:0;

    z-index:0;

    background:
    radial-gradient(circle at 20% 50%,rgba(194,22,185,.12),transparent 50%),
    radial-gradient(circle at 80% 20%,rgba(90,0,120,.12),transparent 50%),
    radial-gradient(circle at 40% 80%,rgba(160,17,163,.12),transparent 50%);

}



/* PARTICLES */

.particles{

    position:fixed;
    inset:0;

    z-index:1;

    pointer-events:none;

}


.particle{

    position:absolute;

    width:2px;
    height:2px;

    background:#c216b9;

    border-radius:50%;

    animation:float 15s linear infinite;

    opacity:0;

}



@keyframes float{

0%{
    transform:translateY(100vh);
    opacity:0;
}

10%{
    opacity:1;
}

90%{
    opacity:1;
}

100%{
    transform:translateY(-100vh);
    opacity:0;
}

}



/* HEADER */


.header{

position:relative;

z-index:10;

text-align:center;

padding:4rem 2rem;

}



.header h1{

font-size:3.5rem;

margin:0;

color:#c216b9;

letter-spacing:3px;

text-shadow:
0 0 20px rgba(194,22,185,.6);

}



.header p{

color:#bbb;

font-size:1.2rem;

}



/* VOUCHES */


.vouches-container{
    position:relative;
    z-index:10;

    max-width:1200px;
    margin:auto;
    padding:2rem;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:2rem;

    grid-auto-rows:10px;
}


.vouch{

    display:inline-block;
    width:100%;

    margin:0 0 2rem;

    break-inside:avoid;
    page-break-inside:avoid;

    background:
    linear-gradient(
    135deg,
    rgba(18,18,18,.95),
    rgba(30,30,30,.95)
    );

    border:2px solid rgba(93,11,110,.3);

    border-radius:20px;

    padding:2rem;

    opacity:0;

    transform:translateY(50px);

    animation:cardSlide .7s ease forwards;

    transition:.35s;

    position:relative;

    overflow:hidden;

    grid-row-end:span 1;

}


@media (max-width: 1100px){

    .vouches-container{
        column-count:2;
    }

}

@media (max-width: 700px){

    .vouches-container{
        column-count:1;
    }

}

@keyframes cardSlide{

to{

opacity:1;

transform:translateY(0);

}

}



.vouch:hover{

transform:
translateY(-10px)
scale(1.02);


border-color:#c216b9;


box-shadow:

0 20px 40px rgba(194,22,185,.25);

}



.vouch::before{

content:"";

position:absolute;

top:0;

left:-100%;

width:100%;

height:100%;


background:

linear-gradient(
90deg,
transparent,
rgba(194,22,185,.12),
transparent
);


transition:.6s;

}


.vouch:hover::before{

left:100%;

}



.vouch-top{

display:flex;

justify-content:space-between;

align-items:center;

}



.rep{
    font-size:22px;
    font-weight:700;
    margin-right:8px;
}


.rep.positive{
    color:#33ff7a;
}


.rep.negative{
    color:#ff5555;
}



.username{
    font-size:20px;
    font-weight:700;
    margin-top:5px;
}


.name::before{
    content:"@";
    color:#c216b9;
}


.date{

color:#888;

font-size:14px;

}



.message{

margin-top:20px;

line-height:1.7;

color:#ccc;

}



.vouch img{

margin-top:20px;

width:100%;

border-radius:15px;

transition:.3s;

cursor:pointer;

}



.vouch img:hover{

transform:scale(1.03);

}

.vouches-container{
    align-items:start;
}


.vouch video{
    margin-top:20px;
    width:100%;
    border-radius:15px;
    display:block;
}


</style>


</head>


<body>


<div class="particles" id="particles"></div>

<div class="bg-animation"></div>


<div id="navbar"></div>



<header class="header">

<h1>
Vouches
</h1>

<p>
Almost 200 and counting.
</p>

</header>



<div class="vouches-container" id="vouches"></div>





<script>






function createParticles(){

const container =
document.getElementById("particles");


for(let i=0;i<50;i++){


let p=document.createElement("div");


p.className="particle";


p.style.left=Math.random()*100+"%";


p.style.animationDelay=
Math.random()*15+"s";


p.style.animationDuration=
(10+Math.random()*10)+"s";


container.appendChild(p);


}


}


createParticles();





async function loadVouches(){


try{


const response =
await fetch("vouches.json");


const data =
await response.json();



const container =
document.getElementById("vouches");



data.reverse().forEach((vouch,index)=>{


let type =
vouch.type === "+"
?
"positive"
:
"negative";



container.innerHTML += `


<div class="vouch"
style="animation-delay:${index*.1}s">


<div class="vouch-top">


<div>

<div class="username">
    <span class="rep ${type}">
        ${vouch.type}
    </span>
    <span class="name">
        ${vouch.username}
    </span>
</div>


</div>



<div class="date">
${new Date(vouch.date)
.toLocaleDateString()}
</div>



</div>



<div class="message">

${vouch.message}

</div>




${
vouch.image ?

`
<a href="${vouch.image}" target="_blank">
    <img src="${vouch.image}" loading="lazy">
</a>
`

:

vouch.video ?

`
<video controls preload="metadata">
    <source src="${vouch.video}" type="video/mp4">
</video>
`

:

""
}



</div>


`;


});


}

catch(e){

console.log(e);

document.getElementById("vouches").innerHTML=
`
<h2>
Could not load vouches.
</h2>
`;

}


}

setTimeout(resizeVouches,50);


loadVouches();

function resizeVouches(){

    const grid = document.querySelector(".vouches-container");
    const rowHeight = parseInt(getComputedStyle(grid).gridAutoRows);
    const rowGap = parseInt(getComputedStyle(grid).gap);

    document.querySelectorAll(".vouch").forEach(card=>{

        const height = card.getBoundingClientRect().height;

        const span = Math.ceil((height + rowGap) / (rowHeight + rowGap));

        card.style.gridRowEnd = `span ${span}`;

    });

}

window.addEventListener("load", resizeVouches);
window.addEventListener("resize", resizeVouches);


</script>



<script src="navbar.js"></script>


</body>

</html>
