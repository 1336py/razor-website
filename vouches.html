<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vouches | Razor</title>
  <meta name="description" content="Every vouch left by Razor customers in our Discord, with screenshots and videos.">
  <meta name="theme-color" content="#07060c">
  <link rel="icon" href="/images/razor_transparent.png">
  <meta property="og:title" content="Razor | Vouches">
  <meta property="og:description" content="Your number 1 solution for maximum security.">
  <meta property="og:url" content="https://razorfn.xyz/vouches.html">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://razorfn.xyz/images/razor_transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/razor.css">
  <script src="/assets/js/razor.js" defer></script>
  <style>
    .tally { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .tally .chip { padding: 8px 14px; font-size: 14px; }
    .tally b { color: var(--text); }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .seg { display: inline-flex; padding: 4px; gap: 2px; border: 1px solid var(--line); border-radius: 13px; background: rgba(14, 12, 22, .8); }
    .seg button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 700; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: rgba(196, 160, 255, .12); color: var(--text); }
    .seg button:hover { color: var(--text); }

    .wall { columns: 3 300px; column-gap: 16px; }
    .vouch {
      display: inline-block; width: 100%;
      margin: 0 0 16px;
      padding: 18px 20px 20px;
      break-inside: avoid;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
    }
    .vouch__top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar {
      display: grid; place-items: center; flex: none;
      width: 34px; height: 34px; border-radius: 11px;
      background: var(--grad-soft); border: 1px solid var(--line);
      font: 700 13px/1 var(--font-display); color: var(--text);
    }
    .who b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rep { flex: none; padding: 3px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 800; }
    .rep.pos { color: var(--ok); background: rgba(78, 229, 154, .1); }
    .rep.neg { color: var(--bad); background: rgba(255, 93, 115, .1); }
    .vouch p { margin-top: 12px; font-size: 15px; overflow-wrap: anywhere; }
    .vouch time { display: block; margin-top: 12px; color: var(--faint); font-size: 13px; font-weight: 600; }
    .vouch__media { display: block; width: 100%; margin-top: 14px; padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: var(--ink-2); cursor: zoom-in; }
    .vouch__media img { width: 100%; transition: transform .4s var(--ease); }
    .vouch__media:hover img { transform: scale(1.03); }
    .vouch video { width: 100%; margin-top: 14px; border-radius: 12px; background: #000; aspect-ratio: 16 / 9; }
    .more { display: flex; justify-content: center; margin-top: 18px; }
  </style>
</head>
<body>
  <div data-site-nav></div>

  <main id="main" class="wrap">
    <header class="page-head">
      <h1>Vouches</h1>
      <p id="lead">Every vouch customers have left in our Discord, newest first.</p>
      <div class="tally" id="tally"></div>
    </header>

    <div class="bar">
      <div class="seg" role="group" aria-label="Filter vouches" id="filter">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="media" aria-pressed="false">With media</button>
      </div>
      <div class="seg" role="group" aria-label="Sort vouches" id="order">
        <button type="button" data-o="new" aria-pressed="true">Newest</button>
        <button type="button" data-o="old" aria-pressed="false">Oldest</button>
      </div>
    </div>

    <div class="wall" id="wall" aria-busy="true" aria-live="polite">
      <div class="skeleton vouch" style="height:140px"></div>
      <div class="skeleton vouch" style="height:200px"></div>
      <div class="skeleton vouch" style="height:120px"></div>
    </div>
    <div class="more"><button class="btn" type="button" id="more" hidden>Show more</button></div>
  </main>

  <div data-site-footer></div>

  <script type="module">
    const R = window.Razor;
    const wall = document.getElementById("wall");
    const moreBtn = document.getElementById("more");
    const PAGE = 30;
    const fmt = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" });
    const state = { filter: "all", order: "new", shown: PAGE };
    let data = [];

    const initials = (name) => (String(name).replace(/[^a-z0-9]/gi, "").slice(0, 2) || "?").toUpperCase();
    const date = (d) => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? "" : fmt.format(t); };

    function list() {
      let l = state.filter === "media" ? data.filter((v) => v.image || v.video) : data;
      return state.order === "new" ? l : [...l].reverse();
    }

    function card(v) {
      const pos = v.type !== "-";
      const media = v.image
        ? '<button class="vouch__media" type="button" data-src="' + R.esc(R.asset(v.image)) + '" aria-label="Open screenshot from ' + R.esc(v.username) + '"><img src="' + R.esc(R.thumb(v.image)) + '" alt="" loading="lazy" decoding="async"></button>'
        : v.video
          ? '<video controls preload="none" playsinline' + (v.poster ? ' poster="' + R.esc(R.asset(v.poster)) + '"' : "") + '><source src="' + R.esc(R.asset(v.video)) + '" type="video/mp4"></video>'
          : "";
      return '<article class="vouch">' +
        '<div class="vouch__top"><div class="who"><span class="avatar" aria-hidden="true">' + R.esc(initials(v.username)) + "</span><b>@" + R.esc(v.username) + "</b></div>" +
        '<span class="rep ' + (pos ? "pos" : "neg") + '">' + (pos ? "+rep" : "−rep") + "</span></div>" +
        "<p>" + R.esc(v.message) + "</p>" + media +
        '<time datetime="' + R.esc(v.date) + '">' + date(v.date) + "</time>" +
        "</article>";
    }

    function render(append) {
      const l = list();
      const slice = append ? l.slice(state.shown - PAGE, state.shown) : l.slice(0, state.shown);
      const html = slice.map(card).join("");
      if (append) wall.insertAdjacentHTML("beforeend", html); else wall.innerHTML = html;
      wall.removeAttribute("aria-busy");
      moreBtn.hidden = state.shown >= l.length;
      moreBtn.textContent = "Show more (" + (l.length - Math.min(state.shown, l.length)) + " left)";
    }

    function seg(groupId, attr, key) {
      const g = document.getElementById(groupId);
      g.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        state[key] = b.dataset[attr];
        state.shown = PAGE;
        g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        render(false);
      });
    }
    seg("filter", "f", "filter");
    seg("order", "o", "order");
    moreBtn.addEventListener("click", () => { state.shown += PAGE; render(true); });

    wall.addEventListener("click", (e) => {
      const b = e.target.closest(".vouch__media");
      if (!b) return;
      const srcs = [...wall.querySelectorAll(".vouch__media")].map((x) => x.dataset.src);
      R.lightbox(srcs, srcs.indexOf(b.dataset.src));
    });

    R.getJSON("/vouches.json").then((raw) => {
      data = [...raw].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const pos = data.filter((v) => v.type !== "-").length;
      const media = data.filter((v) => v.image || v.video).length;
      document.getElementById("lead").textContent = data.length + " vouches and counting, newest first.";
      document.getElementById("tally").innerHTML =
        '<span class="chip"><b>' + Math.round((pos / data.length) * 100) + "%</b> positive</span>" +
        '<span class="chip"><b>' + media + "</b> with screenshots or video</span>" +
        '<span class="chip">Since <b>' + date(data[data.length - 1].date) + "</b></span>";
      render(false);
    }).catch(() => {
      wall.removeAttribute("aria-busy");
      wall.outerHTML = '<div class="panel empty-state"><h2>Vouches didn\'t load</h2><p>Refresh the page, or see them live in our Discord.</p><a class="btn btn--discord" data-discord href="' + R.config.discord + '" target="_blank" rel="noopener">Open Discord</a></div>';
    });
  </script>
</body>
</html>
