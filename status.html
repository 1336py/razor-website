<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Status | Razor</title>
  <meta name="description" content="Live availability of the Razor website, Discord support and product delivery.">
  <meta name="theme-color" content="#07060c">
  <link rel="icon" href="/images/razor_transparent.png">
  <meta property="og:title" content="Razor | Status">
  <meta property="og:description" content="Your number 1 solution for maximum security.">
  <meta property="og:url" content="https://razorfn.xyz/status.html">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://razorfn.xyz/images/razor_transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/razor.css">
  <script src="/assets/js/razor.js" defer></script>
  <style>
    .overall { --c: var(--ok); display: flex; align-items: center; gap: 18px; padding: clamp(20px, 4vw, 30px); border-color: color-mix(in srgb, var(--c) 35%, transparent); }
    .overall.warn { --c: var(--warn); } .overall.bad { --c: var(--bad); }
    .pulse { position: relative; flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 16px var(--c); }
    .pulse::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; animation: ping 2.4s var(--ease) infinite; }
    @keyframes ping { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
    .overall h2 { font: 700 clamp(19px, 2.6vw, 24px)/1.2 var(--font-display); color: var(--c); }
    .overall p { color: var(--muted); margin-top: 4px; font-size: 15px; }

    .services { margin-top: 16px; padding: 6px 0; }
    .svc { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; padding: 18px clamp(18px, 3vw, 26px); }
    .svc + .svc { border-top: 1px solid var(--line); }
    .svc h3 { font-size: 16.5px; }
    .svc p { color: var(--muted); font-size: 14.5px; grid-column: 1; }
    .svc__right { grid-row: 1 / span 2; grid-column: 2; display: grid; justify-items: end; gap: 6px; }
    .badge { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 800; white-space: nowrap; }
    .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .badge.ok { color: var(--ok); background: rgba(78, 229, 154, .1); }
    .badge.warn { color: var(--warn); background: rgba(255, 201, 77, .1); }
    .badge.bad { color: var(--bad); background: rgba(255, 93, 115, .1); }
    .uptime { color: var(--faint); font-size: 13px; font-weight: 600; }
    @media (max-width: 520px) {
      .svc { grid-template-columns: 1fr; }
      .svc__right { grid-row: auto; grid-column: 1; justify-items: start; grid-auto-flow: column; align-items: center; justify-content: start; gap: 12px; }
    }
    .incidents { margin-top: 28px; padding: clamp(20px, 3vw, 28px); }
    .incidents h2 { font: 700 18px/1.2 var(--font-display); }
    .incidents p { color: var(--muted); margin-top: 8px; }
    .stamp { margin-top: 16px; color: var(--faint); font-size: 13.5px; }
    .incident { position: relative; margin-top: 18px; padding-left: 22px; }
    .incident::before { content: ""; position: absolute; left: 4px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--faint)); }
    .incident.ok { --c: var(--ok); } .incident.warn { --c: var(--warn); } .incident.bad { --c: var(--bad); }
    .incident h3 { font-size: 15.5px; }
    .incident__meta { color: var(--faint); font-size: 13px; font-weight: 600; margin-top: 2px; }
    .incident p { margin-top: 6px; font-size: 14.5px; }
  </style>
</head>
<body>
  <div data-site-nav></div>

  <main id="main" class="wrap" style="max-width:calc(860px + var(--gutter) * 2)">
    <header class="page-head">
      <h1>Status</h1>
      <p>Current availability of Razor services.</p>
    </header>

    <section class="panel overall" id="overall" aria-live="polite">
      <span class="pulse" aria-hidden="true"></span>
      <div><h2 id="overall-title">Checking services</h2><p id="overall-sub">One moment.</p></div>
    </section>

    <section class="panel services" id="services" aria-label="Services">
      <div class="svc"><div class="skeleton" style="height:44px;border:0"></div></div>
    </section>

    <section class="panel incidents" aria-labelledby="inc-h">
      <h2 id="inc-h">Recent incidents</h2>
      <div id="incidents"><p>No recent incidents reported. If something isn't working for you, open a ticket in our <a data-discord href="#">Discord</a>.</p></div>
    </section>

    <p class="stamp" id="stamp"></p>
  </main>

  <div data-site-footer></div>

  <script type="module">
    const R = window.Razor;
    const KIND = { operational: "ok", maintenance: "warn", degraded: "warn" };
    const kind = (s) => KIND[String(s || "").toLowerCase()] || "bad";

    function load() {
      R.getJSON("/status.json").then((data) => {
        // Accepts the old plain array or { updated, services, incidents }.
        const services = Array.isArray(data) ? data : (data.services || []);
        const incidents = Array.isArray(data.incidents) ? data.incidents : [];
        const kinds = services.map((s) => kind(s.status));
        const worst = kinds.includes("bad") ? "bad" : kinds.includes("warn") ? "warn" : "ok";
        const affected = services.filter((s) => kind(s.status) !== "ok").map((s) => s.service);
        const overall = document.getElementById("overall");
        overall.className = "panel overall " + worst;
        document.getElementById("overall-title").textContent =
          worst === "ok" ? "All systems operational" : worst === "warn" ? "Partial maintenance" : "Service disruption";
        document.getElementById("overall-sub").textContent =
          worst === "ok" ? "Everything is running normally." : "Affected: " + affected.join(", ") + ".";

        document.getElementById("services").innerHTML = services.map((s) =>
          '<div class="svc"><h3>' + R.esc(s.service) + "</h3><p>" + R.esc(s.description) + "</p>" +
          '<div class="svc__right"><span class="badge ' + kind(s.status) + '">' + R.esc(s.status) + "</span>" +
          (s.uptime ? '<span class="uptime">' + R.esc(s.uptime) + " uptime</span>" : "") + "</div></div>").join("");
        const day = (d) => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? R.esc(d) : t.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }); };
        const IK = { resolved: "ok", monitoring: "warn", investigating: "bad", identified: "bad" };
        if (incidents.length) {
          document.getElementById("incidents").innerHTML = [...incidents]
            .sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 5)
            .map((i) => '<article class="incident ' + (IK[String(i.status || "").toLowerCase()] || "warn") + '"><h3>' + R.esc(i.title) + '</h3>' +
              '<div class="incident__meta">' + R.esc(i.status || "Update") + ", " + day(i.date) + "</div>" +
              (i.details ? "<p>" + R.esc(i.details) + "</p>" : "") + "</article>").join("");
        }
        document.getElementById("stamp").textContent = (data.updated ? "Updated by staff " + day(data.updated) + ". " : "") +
          "Checked " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ".";
      }).catch(() => {
        document.getElementById("overall").className = "panel overall warn";
        document.getElementById("overall-title").textContent = "Status unavailable";
        document.getElementById("overall-sub").textContent = "The status feed didn't load. Refresh, or ask in Discord.";
        document.getElementById("services").hidden = true;
      });
    }
    load();
  </script>
</body>
</html>
